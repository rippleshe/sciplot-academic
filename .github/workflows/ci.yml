name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Sync locked dependencies
      run: uv sync --frozen --extra dev

    - name: Run ruff check
      run: uv run ruff check sciplot/

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Sync locked dependencies
      run: uv sync --frozen --extra dev --extra all

    - name: Run mypy
      run: uv run mypy sciplot/ --ignore-missing-imports

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Sync locked dependencies
      run: uv sync --frozen --extra dev --extra all

    - name: Run tests with coverage
      shell: bash
      run: |
        set +e
        uv run pytest tests/ -v --tb=short --cov=sciplot --cov-report=xml --cov-report=term-missing 2>&1 | tee pytest_output.log
        exit_code=${PIPESTATUS[0]}
        if [ $exit_code -ne 0 ]; then
          echo "::error title=Test failures on ${{ matrix.os }} py${{ matrix.python-version }}::$(tail -n 80 pytest_output.log | tr '\n' ' ' | head -c 4000)"
        fi
        exit $exit_code

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools_scm needs full history for version detection

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Sync locked dependencies
      run: uv sync --frozen --extra dev

    - name: Build package
      run: uv run python -m build

    - name: Check package
      run: uv run twine check dist/*
